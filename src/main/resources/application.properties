spring.application.name=AssetGuard

# --- Database Connection ---
# Using environment variables for security
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:2KqUJD3irmvFD9Q.root}
spring.datasource.password=${DB_PASSWORD:GI76Oxuk8EGo4wgR}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- Server Settings ---
server.port=${PORT:8080}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:assetguard-secret-key-that-is-at-least-256-bits-long-for-security-purposes-only}
jwt.expiration=86400000

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Session ---
server.servlet.session.timeout=30m

# --- Logging ---
logging.level.com.assetguard=INFO
logging.level.org.springframework.security=WARN