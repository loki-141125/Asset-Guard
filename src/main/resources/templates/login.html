<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <div class="auth-container">
        <div class="glass auth-card">
            <h2 style="text-align: center;">Welcome Back</h2>
            <form th:action="@{/login}" method="post">
                <div th:if="${param.error}"
                    style="text-align: center; color: var(--danger); margin-bottom: 1rem; background: rgba(239, 68, 68, 0.1); padding: 0.5rem; border-radius: 8px;">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}"
                    style="text-align: center; color: var(--success); margin-bottom: 1rem; background: rgba(16, 185, 129, 0.1); padding: 0.5rem; border-radius: 8px;">
                    You have been logged out.
                </div>

                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username or email"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>

                <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                    Don't have an account? <a th:href="@{/register}">Sign up</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
