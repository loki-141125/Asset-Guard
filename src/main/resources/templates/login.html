<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="auth-page">
    <div class="auth-container">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="glass auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to manage your assets</p>
            </div>

            <div th:if="${error}" class="alert alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <div th:if="${message}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${message}">Success message</span>
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="username" class="form-control" placeholder="you@example.com" required
                            autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password"
                            required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="remember-me">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>
            </form>

            <div class="auth-divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button class="btn btn-social">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button class="btn btn-social">
                    <i class="fa-brands fa-github"></i>
                </button>
                <button class="btn btn-social">
                    <i class="fa-brands fa-microsoft"></i>
                </button>
            </div>

            <p class="auth-footer">
                Don't have an account?
                <a th:href="@{/register}">Create account</a>
            </p>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
