<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; font-family: sans-serif; }
        .box { background: #1e293b; padding: 40px; width: 300px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        input { width: 90%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        h2 { color: white; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Nexus Login</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Enter Dashboard</button>
        </form>
    </div>
</body>
</html>
