<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Command</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8; --green: #4ade80; --red: #f87171; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: #111827; border-right: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 30px; letter-spacing: 1px; }
        .log-feed { flex: 1; overflow-y: auto; font-size: 12px; }
        .log-item { border-left: 2px solid #334155; padding-left: 10px; margin-bottom: 15px; position: relative; }
        .log-item::before { content: ''; position: absolute; left: -5px; top: 0; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
        .log-time { color: #94a3b8; font-size: 10px; }

        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        
        /* Stats Grid */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .stat-num { font-size: 32px; font-weight: bold; }
        .stat-label { color: #94a3b8; font-size: 13px; text-transform: uppercase; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select, button { background: var(--card); border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--accent); }
        button.primary { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; }
        button.primary:hover { opacity: 0.9; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #94a3b8; padding: 15px; border-bottom: 1px solid #334155; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .b-Available { background: rgba(74, 222, 128, 0.2); color: var(--green); }
        .b-InUse { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
        .b-Repair { background: rgba(248, 113, 113, 0.2); color: var(--red); }

        .btn-icon { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.7; padding: 5px; }
        .btn-icon:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">⚡ NEXUS ASSETS</div>
        <div style="margin-bottom: 10px; font-weight:600; font-size:12px; color:#94a3b8;">AUDIT LOG</div>
        <div id="log-feed" class="log-feed"></div>
    </div>

    <div class="main">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Assets</div>
                <div class="stat-num" id="s-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Available</div>
                <div class="stat-num" style="color:var(--green)" id="s-av">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active / In Use</div>
                <div class="stat-num" style="color:var(--accent)" id="s-use">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Maintenance</div>
                <div class="stat-num" style="color:var(--red)" id="s-rep">0</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="name" placeholder="Device Name" style="flex:2">
            <input type="text" id="serial" placeholder="Serial #" style="flex:1">
            <button class="primary" onclick="add()">+ Add Asset</button>
            <input type="text" id="search" placeholder="🔍 Search..." style="margin-left:auto" onkeyup="render()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Asset Details</th>
                    <th>Current User</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        const API = "/api";
        let assets = [];

        async function init() {
            await Promise.all([loadStats(), loadAssets(), loadHistory()]);
        }

        async function loadStats() {
            const res = await fetch(API + "/stats");
            const data = await res.json();
            document.getElementById("s-total").innerText = data.total;
            document.getElementById("s-av").innerText = data.available;
            document.getElementById("s-use").innerText = data.active;
            document.getElementById("s-rep").innerText = data.repair;
        }

        async function loadAssets() {
            const res = await fetch(API + "/assets");
            assets = await res.json();
            render();
        }

        async function loadHistory() {
            const res = await fetch(API + "/history");
            const data = await res.json();
            document.getElementById("log-feed").innerHTML = data.map(i => `
                <div class="log-item">
                    <div style="color:white"><b>${i.assetName}</b>: ${i.action}</div>
                    <div class="log-time">${new Date(i.timestamp).toLocaleString()} • ${i.user}</div>
                </div>
            `).join("");
        }

        function render() {
            const term = document.getElementById("search").value.toLowerCase();
            const filtered = assets.filter(x => x.name.toLowerCase().includes(term) || x.serialNumber.toLowerCase().includes(term));
            
            document.getElementById("list").innerHTML = filtered.map(i => {
                let badge = "b-" + i.status.replace(" ", "");
                return `
                <tr>
                    <td>
                        <div style="font-weight:600">${i.name}</div>
                        <div style="color:#64748b; font-size:12px">${i.serialNumber}</div>
                    </td>
                    <td>${i.assignedTo ? `👤 ` + i.assignedTo : `<span style="opacity:0.3">Unassigned</span>`}</td>
                    <td><span class="badge ${badge}">${i.status}</span></td>
                    <td>
                        <button class="btn-icon" onclick="assign(${i.id})">📲</button>
                        <button class="btn-icon" onclick="repair(${i.id})">🔧</button>
                        <button class="btn-icon" style="color:#f87171" onclick="del(${i.id})">✕</button>
                    </td>
                </tr>`;
            }).join("");
        }

        async function add() {
            const name = document.getElementById("name").value;
            const serial = document.getElementById("serial").value;
            if(!name) return;
            await fetch(API + "/add", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ name, serialNumber: serial, status: "Available" })
            });
            document.getElementById("name").value = "";
            document.getElementById("serial").value = "";
            init();
        }

        async function assign(id) {
            const user = prompt("Assign to Employee Name:");
            if(user) await update(id, "In Use", user);
        }

        async function repair(id) {
            if(confirm("Send to repair?")) await update(id, "Repair", "Maintenance Team");
        }

        async function update(id, status, user) {
            await fetch(API + "/update/" + id, {
                method: "PUT", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ status, assignedTo: user })
            });
            init();
        }

        async function del(id) {
            if(confirm("Delete asset?")) {
                await fetch(API + "/delete/" + id, { method: "DELETE" });
                init();
            }
        }

        init();
    </script>
</body>
</html>
