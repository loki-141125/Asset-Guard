<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <div class="dashboard-container">
        <nav class="navbar glass" style="padding: 1rem 2rem; border-radius: 16px;">
            <div class="nav-logo">
                <i class="fa-solid fa-shield-halved"></i> AssetGuard
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span th:text="${user.username}" style="color: var(--text-muted);">User</span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem;" title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>
        </nav>

        <div class="stats-grid">
            <div class="glass stat-card">
                <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
                <div>
                    <div class="stat-value" th:text="${'$' + #numbers.formatDecimal(totalValue, 1, 2)}">$0.00</div>
                    <div class="stat-label">Total Asset Value</div>
                </div>
            </div>
            <div class="glass stat-card">
                <div class="stat-icon"><i class="fa-solid fa-cubes"></i></div>
                <div>
                    <div class="stat-value" th:text="${assetCount}">0</div>
                    <div class="stat-label">Total Assets Tracked</div>
                </div>
            </div>
        </div>

        <div class="glass assets-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3>Your Assets</h3>
                <button onclick="toggleModal()" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add Asset
                </button>
            </div>

            <div class="asset-list" th:if="${!assets.empty}">
                <div th:each="asset : ${assets}" class="glass asset-item"
                    style="border: none; background: rgba(255,255,255,0.02);">
                    <div class="asset-icon">
                        <i
                            th:class="${'fa-solid ' + (asset.type == 'Electronics' ? 'fa-laptop' : (asset.type == 'Vehicle' ? 'fa-car' : (asset.type == 'Real Estate' ? 'fa-house' : 'fa-box')))}"></i>
                    </div>
                    <div class="asset-info">
                        <h4 th:text="${asset.name}">Asset Name</h4>
                        <p th:text="${asset.type}">Type</p>
                    </div>
                    <div class="asset-value" th:text="${'$' + #numbers.formatDecimal(asset.value, 1, 2)}">$1200.00</div>
                    <div style="color: var(--text-muted); font-size: 0.85rem;" th:text="${asset.purchaseDate}">
                        2023-01-01</div>
                </div>
            </div>

            <div th:if="${assets.empty}" class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <p>No assets tracked yet. Click "Add Asset" to begin.</p>
            </div>
        </div>
    </div>

    <!-- Add Asset Modal -->
    <div id="addAssetModal" class="modal">
        <div class="glass modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3>Add New Asset</h3>
                <button onclick="toggleModal()"
                    style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form th:action="@{/assets/add}" th:object="${newAsset}" method="post">
                <div class="form-group">
                    <label class="form-label">Asset Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. MacBook Pro" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <select th:field="*{type}" class="form-control"
                            style="background-color: #1e293b; color: white;">
                            <option value="Electronics">Electronics</option>
                            <option value="Vehicle">Vehicle</option>
                            <option value="Real Estate">Real Estate</option>
                            <option value="Investment">Investment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Value ($)</label>
                        <input type="number" step="0.01" th:field="*{value}" class="form-control" placeholder="0.00"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Purchase Date</label>
                    <input type="date" th:field="*{purchaseDate}" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Description (Optional)</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">Save Asset</button>
            </form>
        </div>
    </div>
</body>

</html>
