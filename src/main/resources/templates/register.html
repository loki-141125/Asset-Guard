<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <div class="auth-container">
        <div class="glass auth-card">
            <h2 style="text-align: center;">Join AssetGuard</h2>
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div th:if="${error}"
                    style="text-align: center; color: var(--danger); margin-bottom: 1rem; background: rgba(239, 68, 68, 0.1); padding: 0.5rem; border-radius: 8px;">
                    <span th:text="${error}">Error</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Choose a username"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Create a password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create
                    Account</button>

                <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                    Already have an account? <a th:href="@{/login}">Sign in</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
