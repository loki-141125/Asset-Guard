<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetGuard - Sign Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .password-strength {
            margin-top: 8px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .strength-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s;
        }

        .strength-weak { background: #e74c3c; }
        .strength-fair { background: #f39c12; }
        .strength-good { background: #27ae60; }

        .strength-text {
            font-size: 12px;
            color: #666;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signin-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signin-link a:hover {
            color: #764ba2;
        }

        .terms {
            margin: 15px 0;
            font-size: 13px;
            color: #666;
        }

        .terms input {
            margin-right: 8px;
        }

        .password-requirements {
            margin-top: 10px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }

        .password-requirements.show {
            display: block;
        }

        .req-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            color: #666;
        }

        .req-item.met {
            color: #27ae60;
        }

        .req-check {
            margin-right: 8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <h1>Create Account</h1>
            <p>Join AssetGuard today</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="signupForm" onsubmit="handleSignUp(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        placeholder="John" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName" 
                        placeholder="Doe" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="">-- Select Department --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                    minlength="8"
                    onchange="validatePassword()"
                >
                <div id="passwordStrength" class="password-strength">
                    <div class="strength-bar">
                        <div id="strengthFill" class="strength-fill"></div>
                    </div>
                    <div class="strength-text">
                        Password strength: <span id="strengthText">weak</span>
                    </div>
                </div>
                <div id="passwordReqs" class="password-requirements">
                    <div class="req-item" id="req-length">
                        <span class="req-check">○</span> At least 8 characters
                    </div>
                    <div class="req-item" id="req-case">
                        <span class="req-check">○</span> Mix of uppercase and lowercase
                    </div>
                    <div class="req-item" id="req-number">
                        <span class="req-check">○</span> At least one number
                    </div>
                    <div class="req-item" id="req-special">
                        <span class="req-check">○</span> At least one special character
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" name="terms" required> 
                    I agree to the Terms of Service and Privacy Policy
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
        </form>

        <div class="signin-link">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>

    <script>
        async function loadDepartments() {
            try {
                const response = await fetch('/api/departments');
                const departments = await response.json();
                const select = document.getElementById('department');
                
                departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading departments:', error);
            }
        }

        loadDepartments();

        function validatePassword() {
            const password = document.getElementById('password').value;
            const reqs = {
                length: password.length >= 8,
                case: /[a-z]/.test(password) && /[A-Z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[^a-zA-Z0-9]/.test(password)
            };

            document.getElementById('req-length').classList.toggle('met', reqs.length);
            document.getElementById('req-length').querySelector('.req-check').textContent = reqs.length ? '✓' : '○';
            
            document.getElementById('req-case').classList.toggle('met', reqs.case);
            document.getElementById('req-case').querySelector('.req-check').textContent = reqs.case ? '✓' : '○';
            
            document.getElementById('req-number').classList.toggle('met', reqs.number);
            document.getElementById('req-number').querySelector('.req-check').textContent = reqs.number ? '✓' : '○';
            
            document.getElementById('req-special').classList.toggle('met', reqs.special);
            document.getElementById('req-special').querySelector('.req-check').textContent = reqs.special ? '✓' : '○';

            return reqs.length && reqs.case && reqs.number && reqs.special;
        }

        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculateStrength(password);
            const strengthEl = document.getElementById('passwordStrength');
            const reqs = document.getElementById('passwordReqs');
            const fillEl = document.getElementById('strengthFill');
            const textEl = document.getElementById('strengthText');

            if (password.length > 0) {
                strengthEl.classList.add('show');
                reqs.classList.add('show');
                validatePassword();
            } else {
                strengthEl.classList.remove('show');
                reqs.classList.remove('show');
            }

            const fillClass = ['strength-weak', 'strength-fair', 'strength-good'];
            fillEl.className = `strength-fill ${fillClass[strength]}`;

            const texts = ['weak', 'fair', 'good'];
            textEl.textContent = texts[strength];
        });

        function calculateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password) && /[^a-zA-Z0-9]/.test(password)) strength++;
            return Math.min(strength, 2);
        }

        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert show alert-${type}`;
            setTimeout(() => alertEl.classList.remove('show'), 5000);
        }

        async function handleSignUp(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'error');
                return;
            }

            if (!validatePassword()) {
                showAlert('Password does not meet all requirements!', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '🔄 Creating Account...';

            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: password,
                departmentId: document.getElementById('department').value || null
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting to sign in...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Sign up failed. Please try again.', 'error');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
